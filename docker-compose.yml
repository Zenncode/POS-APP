services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: zenntechinc-app
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    ports:
      - '5173:5173'
    volumes:
      - ./app:/app/app
      - ./public:/app/public
      - ./tests:/app/tests
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - /app/node_modules
      - /app/build
      - /app/.react-router
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge